name: Blind Sniper Memory Tests

on:
  pull_request:
    paths:
      - "memory/**"
      - "scripts/blind_sniper_memory.py"
      - "scripts/blind_sniper_memory_knowledge.py"
      - "scripts/blind_sniper_memory_retrieval.py"
      - "scripts/blind_sniper_memory_handoff.py"
      - "scripts/blind_sniper_daemon.py"
      - "scripts/blind_sniper_handoff_runtime.py"
      - "scripts/blind_sniper_tool_runtime.py"
      - "scripts/blind_sniper_model_worker.py"
      - "scripts/blind_sniper_worker.py"
      - "scripts/blind_sniper_agent_runtime.py"
      - "scripts/blind_sniper_redact.py"
      - "tests/test_blind_sniper_memory.py"
      - "tests/test_blind_sniper_memory_runtime.py"
      - "tests/test_blind_sniper_memory_knowledge.py"
      - "tests/test_blind_sniper_memory_retrieval.py"
      - "tests/test_blind_sniper_memory_handoff.py"
      - "tests/test_blind_sniper_daemon.py"
      - "tests/test_blind_sniper_tool_runtime.py"
      - ".github/workflows/blind-sniper-memory.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "memory/**"
      - "scripts/blind_sniper_memory.py"
      - "scripts/blind_sniper_memory_knowledge.py"
      - "scripts/blind_sniper_memory_retrieval.py"
      - "scripts/blind_sniper_memory_handoff.py"
      - "scripts/blind_sniper_redact.py"
      - "scripts/blind_sniper_daemon.py"
      - "tests/test_blind_sniper_memory.py"
      - "tests/test_blind_sniper_memory_runtime.py"
      - "tests/test_blind_sniper_memory_knowledge.py"
      - "tests/test_blind_sniper_memory_retrieval.py"
      - "tests/test_blind_sniper_memory_handoff.py"
      - ".github/workflows/blind-sniper-memory.yml"

permissions:
  contents: read

jobs:
  memory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile memory module
        run: python -m py_compile scripts/blind_sniper_memory.py scripts/blind_sniper_redact.py scripts/blind_sniper_daemon.py scripts/blind_sniper_handoff_runtime.py scripts/blind_sniper_tool_runtime.py scripts/blind_sniper_model_worker.py scripts/blind_sniper_worker.py scripts/blind_sniper_agent_runtime.py scripts/blind_sniper_memory_knowledge.py scripts/blind_sniper_memory_retrieval.py scripts/blind_sniper_memory_handoff.py
      - name: Run memory, tool-runtime and daemon handoff tests
        run: |
          python -m unittest discover -s tests -p 'test_blind_sniper_memory*.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_tool_runtime.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_daemon.py' -v
