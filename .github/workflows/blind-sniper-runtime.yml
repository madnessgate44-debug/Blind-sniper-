name: Blind Sniper Runtime Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "chatgpt-home/runtime/**"
      - "scripts/validate_blind_sniper_runtime.py"
      - "scripts/blind_sniper_runtime.py"
      - "scripts/blind_sniper_ledger.py"
      - "scripts/simulate_blind_sniper_e2e.py"
      - "scripts/simulate_blind_sniper_jobs_e2e.py"
      - "scripts/find_skill.py"
      - "scripts/adapt_skill.py"
      - "scripts/validate_codex_config.py"
      - "chatgpt-home/config/**"
      - "chatgpt-home/runtime/skills.index.json"
      - "tests/test_blind_sniper_ledger.py"
      - "tests/test_blind_sniper_jobs_simulation.py"
      - "tests/test_blind_sniper_skill_tooling.py"
      - "tests/test_blind_sniper_codex_config.py"
      - "tests/test_blind_sniper_github_ledger.py"
      - "tests/test_blind_sniper_orchestration.py"
      - "tests/test_blind_sniper_runtime.py"
      - "tests/test_blind_sniper_receipt.py"
      - "tests/test_blind_sniper_executor_workflow.py"
      - "scripts/blind_sniper_receipt.py"
      - "scripts/blind_sniper_redact.py"
      - "scripts/blind_sniper_worker.py"
      - "scripts/blind_sniper_model_worker.py"
      - "scripts/blind_sniper_agent_runtime.py"
      - "scripts/blind_sniper_tool_runtime.py"
      - "scripts/blind_sniper_autonomy.py"
      - "tests/test_blind_sniper_redact.py"
      - "tests/test_blind_sniper_worker.py"
      - "tests/test_blind_sniper_model_worker.py"
      - "tests/test_blind_sniper_agent_runtime.py"
      - "tests/test_blind_sniper_tool_runtime.py"
      - "tests/test_blind_sniper_autonomy.py"
      - ".github/workflows/blind-sniper-worker.yml"
      - ".github/workflows/blind-sniper-executor.yml"
      - ".github/workflows/blind-sniper-runtime.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "chatgpt-home/runtime/**"
      - "scripts/validate_blind_sniper_runtime.py"
      - "scripts/blind_sniper_runtime.py"
      - "scripts/blind_sniper_ledger.py"
      - "scripts/simulate_blind_sniper_e2e.py"
      - "scripts/simulate_blind_sniper_jobs_e2e.py"
      - "scripts/find_skill.py"
      - "scripts/adapt_skill.py"
      - "scripts/validate_codex_config.py"
      - "chatgpt-home/config/**"
      - "chatgpt-home/runtime/skills.index.json"
      - "tests/test_blind_sniper_ledger.py"
      - "tests/test_blind_sniper_jobs_simulation.py"
      - "tests/test_blind_sniper_skill_tooling.py"
      - "tests/test_blind_sniper_codex_config.py"
      - "tests/test_blind_sniper_github_ledger.py"
      - "tests/test_blind_sniper_orchestration.py"
      - "tests/test_blind_sniper_runtime.py"
      - "tests/test_blind_sniper_receipt.py"
      - "tests/test_blind_sniper_executor_workflow.py"
      - "scripts/blind_sniper_receipt.py"
      - "scripts/blind_sniper_redact.py"
      - "scripts/blind_sniper_worker.py"
      - "scripts/blind_sniper_model_worker.py"
      - "scripts/blind_sniper_autonomy.py"
      - "tests/test_blind_sniper_redact.py"
      - "tests/test_blind_sniper_worker.py"
      - "tests/test_blind_sniper_model_worker.py"
      - "tests/test_blind_sniper_autonomy.py"
      - ".github/workflows/blind-sniper-worker.yml"
      - ".github/workflows/blind-sniper-executor.yml"
      - ".github/workflows/blind-sniper-runtime.yml"

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime registries
        run: python scripts/validate_blind_sniper_runtime.py
      - name: Audit the skill catalog
        run: python scripts/find_skill.py --validate
      - name: Run runtime unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run end-to-end interruption and recovery simulation
        run: python scripts/simulate_blind_sniper_e2e.py --output-dir artifacts/blind-sniper-e2e
      - name: Run scheduled-jobs end-to-end simulation
        run: python scripts/simulate_blind_sniper_jobs_e2e.py --output-dir artifacts/blind-sniper-jobs-e2e
      - name: Upload end-to-end simulation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-sniper-e2e-${{ github.run_id }}
          path: |
            artifacts/blind-sniper-e2e/
            artifacts/blind-sniper-jobs-e2e/
          if-no-files-found: warn
          retention-days: 14
