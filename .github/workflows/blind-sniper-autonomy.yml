name: Blind Sniper Continuous Autonomy

# Bounded continuous-autonomy acceptance and one worker pass.
#
# Deliberately workflow_dispatch only. No `schedule:` trigger is declared: a
# schedule must not be activated until the executor, a durable private data
# store and the required secrets are genuinely configured. This workflow proves
# the queue/lease/heartbeat/recovery controls and the adapter contracts with a
# read-only checkout and no third-party credentials.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task identifier (A-Za-z0-9._- , max 64 chars)"
        required: false
        type: string
        default: BS-AUTONOMY-SMOKE-001

permissions:
  contents: read

jobs:
  acceptance:
    name: Queue, worker and adapter acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate runtime registries
        run: python scripts/validate_blind_sniper_runtime.py

      - name: Run durable-queue, worker, model-agent and adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_blind_sniper_queue.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_worker.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_model_worker.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_openhands_cloud.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_forge_mcp.py' -v
          python -m unittest discover -s tests -p 'test_blind_sniper_autonomous_e2e.py' -v

      - name: Emit autonomy capability status
        run: |
          python scripts/blind_sniper_autonomy_status.py \
            --ledger .blind-sniper/state/events.jsonl \
            --output artifacts/blind-sniper-autonomy/status.json

      - name: Upload autonomy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-sniper-autonomy-${{ github.run_id }}
          path: artifacts/blind-sniper-autonomy/
          if-no-files-found: warn
          retention-days: 14

  worker-pass:
    name: One bounded durable-queue worker pass
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one worker pass and print the health digest
        env:
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The worker CLI performs stale-lease recovery + a health digest over the
          # local ledger. It does not claim a resident process; the ledger is the
          # logical durable store and is replayed on each invocation.
          python scripts/blind_sniper_worker.py \
            --ledger .blind-sniper/state/events.jsonl \
            --owner-id "ci-${RUN_ID}" \
            --run-nonce "ci-${RUN_ID}" \
            --sweep-stale \
            --output artifacts/blind-sniper-autonomy/worker-digest.json

      - name: Upload worker digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-sniper-autonomy-worker-${{ github.run_id }}
          path: artifacts/blind-sniper-autonomy/worker-digest.json
          if-no-files-found: warn
          retention-days: 14
