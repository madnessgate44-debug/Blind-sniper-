name: Blind Sniper Allowlisted Executor

on:
  push:
    branches:
      - "feat/allowlisted-executor-2026-11-09"
    paths:
      - ".blind-sniper/tasks/**"
      - "scripts/blind_sniper_executor.py"
      - ".github/workflows/blind-sniper-allowlisted-executor.yml"

permissions:
  contents: read

jobs:
  execute-allowlisted-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout named branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .blind-sniper/tasks/
            scripts/
            tests/
            chatgpt-home/runtime/
            chatgpt-home/skills/
            chatgpt-home/agents/
            chatgpt-home/workflows/
            chatgpt-home/templates/
            chatgpt-home/openhands-library/.agents/skills/
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute task-file allowlist
        run: >-
          python scripts/blind_sniper_executor.py
          --task-file .blind-sniper/tasks/runtime-hardening-verification.json
          --branch "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --output-dir artifacts/blind-sniper

      - name: Upload execution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-sniper-run-${{ github.run_id }}
          path: artifacts/blind-sniper/
          if-no-files-found: error
          retention-days: 14
